<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GH Speed Alert</title>
<style>
body{margin:0;font-family:sans-serif;background:#111;color:#fff;text-align:center;padding:16px}
#spd{font-size:90px;font-weight:700}
#alert{margin:16px 0;padding:20px;border-radius:12px;background:#222;font-size:22px}
.warn{background:#c62828!important}
button{font-size:18px;padding:14px 22px;margin:6px;border-radius:10px;border:0}
input{font-size:18px;padding:12px;border-radius:10px;border:0;width:70%}
#lock{display:none;background:#222;padding:20px;border-radius:12px;margin:16px 0}
.small{font-size:13px;color:#aaa;margin-top:20px}
</style></head><body>
<h2>GH Speed Alert</h2>
<div class="small" style="margin:0 0 12px">Created &amp; developed by Massa Kwame Femeyibor</div>
<div id="spd">0</div><div>km/h</div>
<div id="alert">Tap Start</div>
<div id="lock">
 <p><b>Your 3-month free period has ended.</b></p>
 <p>To continue, pay GHS 20 per month to MoMo: <b>0XX XXX XXXX</b> (Massa Kwame Femeyibor), then enter your unlock code.</p>
 <input id="code" placeholder="Unlock code"><br>
 <button onclick="unlock()">Unlock</button>
</div>
<button onclick="start()">Start</button>
<button onclick="say('Speed limit 50 ahead')">Test alert</button>
<div id="st"></div>
<div id="trial" class="small"></div>
<div class="small">&copy; Massa Kwame Femeyibor. All rights reserved.</div>
<script>
// ===== SETTINGS: EDIT THESE =====
const TRIAL_DAYS=90;
const UNLOCK_CODE="CHANGE-ME-1234";
// ================================
const SIGNS=[
{lat:5.6037,lng:-0.1870,msg:"Speed limit 50 ahead",lim:50},
{lat:5.6100,lng:-0.1900,msg:"School zone ahead. Slow down",lim:30},
{lat:5.6200,lng:-0.2000,msg:"Speed bump ahead",lim:20}
];
const RANGE=300,last={};
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
if(!ls('ghsa_first'))ls('ghsa_first',String(Date.now()));
function daysLeft(){
 const used=(Date.now()-Number(ls('ghsa_first')||Date.now()))/86400000;
 return Math.ceil(TRIAL_DAYS-used);
}
function allowed(){return ls('ghsa_unlocked')==='yes'||daysLeft()>0;}
function refresh(){
 const ok=allowed();
 document.getElementById('lock').style.display=ok?'none':'block';
 document.getElementById('trial').textContent=ls('ghsa_unlocked')==='yes'?'Full version unlocked':(ok?'Free trial: '+daysLeft()+' days left':'');
}
function unlock(){
 if(document.getElementById('code').value.trim()===UNLOCK_CODE){ls('ghsa_unlocked','yes');refresh();say('Unlocked. Thank you');}
 else say('Wrong code');
}
function say(m){
 const el=document.getElementById('alert');
 el.textContent=m;el.classList.add('warn');
 setTimeout(()=>el.classList.remove('warn'),6000);
 try{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(m));}catch(e){}
 if(navigator.vibrate)navigator.vibrate([300,100,300]);
}
const R=Math.PI/180;
function dist(a,b,c,d){
 const x=(d-b)*R*Math.cos((a+c)/2*R),y=(c-a)*R;
 return Math.sqrt(x*x+y*y)*6371000;
}
function bearing(a,b,c,d){
 const y=Math.sin((d-b)*R)*Math.cos(c*R);
 const x=Math.cos(a*R)*Math.sin(c*R)-Math.sin(a*R)*Math.cos(c*R)*Math.cos((d-b)*R);
 return (Math.atan2(y,x)/R+360)%360;
}
let watching=false;
function start(){
 refresh();
 if(!allowed()){say("Free period ended. Please unlock to continue");return;}
 if(watching)return;
 watching=true;
 say("Speed alert started");
 if(navigator.wakeLock)navigator.wakeLock.request('screen').catch(()=>{});
 navigator.geolocation.watchPosition(p=>{
  if(!allowed()){refresh();return;}
  const c=p.coords,kmh=Math.round((c.speed||0)*3.6);
  document.getElementById('spd').textContent=kmh;
  document.getElementById('st').textContent="GPS accuracy: "+Math.round(c.accuracy)+" m";
  SIGNS.forEach((s,i)=>{
   const d=dist(c.latitude,c.longitude,s.lat,s.lng);
   if(d>RANGE)return;
   if(c.heading!=null&&kmh>5){
    let diff=Math.abs(bearing(c.latitude,c.longitude,s.lat,s.lng)-c.heading);
    if(diff>180)diff=360-diff;
    if(diff>70)return;
   }
   if(Date.now()-(last[i]||0)<120000)return;
   last[i]=Date.now();
   say(s.msg+(s.lim&&kmh>s.lim?". You are over the limit":""));
  });
 },e=>{document.getElementById('st').textContent="GPS error: "+e.message},
 {enableHighAccuracy:true,maximumAge:1000});
}
refresh();
</script></body></html
